<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; margin: 0; padding: 14px 16px; width: 230px; background: #262421; color: #e8e6e3; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    label { display: flex; align-items: center; gap: 8px; margin: 8px 0; cursor: pointer; }
    p { color: #a8a6a3; font-size: 12px; margin: 10px 0 0; }
  </style>
</head>
<body>
  <h1>ZenChess</h1>
  <label><input type="checkbox" id="enabled"> Zen mode</label>
  <label><input type="checkbox" id="hideOwnRating"> Hide my rating</label>
  <label><input type="checkbox" id="flagNewAccounts"> Flag new accounts</label>
  <p>Changes apply instantly to open chess.com tabs.</p>
  <script src="popup.js"></script>
</body>
</html>
